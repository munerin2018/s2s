[package]
name = "s2s-peer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
futures = "0.3.34"
libp2p = { version = "0.57.0", features = ["tokio", "tcp", "websocket", "dns", "noise", "yamux", "gossipsub", "mdns", "identify", "ping", "macros", "ed25519"] }
libp2p-stream = "0.5.0-alpha"
rand_core = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
