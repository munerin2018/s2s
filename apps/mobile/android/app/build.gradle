apply plugin: 'com.android.application'

/*
 * Release signing.
 *
 * The upload key never lives in this repository. Its properties file is read
 * from S2S_KEYSTORE_PROPERTIES, or ~/.s2s-release/keystore.properties by
 * default. When neither exists the release build is simply left unsigned, so
 * anyone can still build and inspect it - only the account holder can produce
 * something Google Play will accept.
 */
def keystorePropsFile = file(System.getenv('S2S_KEYSTORE_PROPERTIES')
    ?: "${System.getProperty('user.home')}/.s2s-release/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

/*
 * Version, from the root package.json so there is one number to bump.
 *
 * versionCode must strictly increase with every upload to Play and can never
 * be reused, so it is derived from the semver rather than typed by hand:
 * 0.2.0 -> 200, 1.4.12 -> 10412.
 */
def rootPackage = new groovy.json.JsonSlurper().parse(file('../../../../package.json'))
def semver = rootPackage.version.tokenize('.').collect { it.toInteger() }
def derivedVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]

android {
    namespace = "io.github.munerin2018.s2s"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.munerin2018.s2s"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode derivedVersionCode
        versionName rootPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreProps['storeFile']) {
            upload {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // The app is a WebView around a bundle Vite has already minified;
            // R8 has almost nothing to shrink and a lot to break by renaming
            // classes Capacitor reaches by reflection.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.upload
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
